AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  DrainGuard — Preventive drain-maintenance and risk-triage platform.
  Amazon Environmental Hacks 2026 · Track 02: Heat and Water.

# ── Parameters ────────────────────────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  AllowedOrigins:
    Type: String
    Default: "http://localhost:5173,http://localhost:5174,http://localhost:5175,*"
    Description: >
      Comma-separated list of allowed CORS origins.
      Update after Amplify deployment to include the Amplify HTTPS URL.

# ── Globals ───────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        REPORTS_TABLE: !Ref ReportsTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        PRESIGN_EXPIRY_SECONDS: "300"
        PRESIGN_GET_EXPIRY_SECONDS: "3600"
        ALLOWED_ORIGINS: !Ref AllowedOrigins

# ── Resources ─────────────────────────────────────────────────────────────────
Resources:

  # ── API Gateway HTTP API ─────────────────────────────────────────────────
  DrainGuardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref AllowedOrigins]
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
        MaxAge: 600

  # ── Lambda Functions ────────────────────────────────────────────────────

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "drainguard-health-${Stage}"
      CodeUri: ../backend/
      Handler: src.handlers.health.handler
      Description: Liveness probe
      Events:
        HttpGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DrainGuardApi
            Path: /health
            Method: GET

  ListReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "drainguard-list-reports-${Stage}"
      CodeUri: ../backend/
      Handler: src.handlers.list_reports.handler
      Description: List drain-blockage reports with filters and pagination
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ReportsTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        HttpGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref DrainGuardApi
            Path: /reports
            Method: GET

  CreateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "drainguard-create-report-${Stage}"
      CodeUri: ../backend/
      Handler: src.handlers.create_report.handler
      Description: Create a new drain-blockage report
      Timeout: 20   # extra time for Open-Meteo call
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ReportsTable
      Events:
        HttpPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref DrainGuardApi
            Path: /reports
            Method: POST

  UpdateStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "drainguard-update-status-${Stage}"
      CodeUri: ../backend/
      Handler: src.handlers.update_status.handler
      Description: Update cleanup workflow status on a report
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
      Events:
        HttpPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref DrainGuardApi
            Path: /reports/{id}/status
            Method: PATCH

  PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "drainguard-presign-${Stage}"
      CodeUri: ../backend/
      Handler: src.handlers.presign.handler
      Description: Generate presigned S3 POST URL for direct browser upload
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        HttpPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref DrainGuardApi
            Path: /uploads/presign
            Method: POST

  # ── DynamoDB Table ──────────────────────────────────────────────────────
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: DrainGuardReports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: report_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: risk_score
          AttributeType: N
      KeySchema:
        - AttributeName: report_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusCreatedAtIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: PriorityIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: risk_score
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── S3 Bucket ───────────────────────────────────────────────────────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Name is auto-generated to ensure global uniqueness
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [",", !Ref AllowedOrigins]
            AllowedMethods: [GET, PUT, POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUnconfirmedUploads
            Status: Enabled
            # Clean up any orphaned multipart uploads after 1 day
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

# ── Outputs ───────────────────────────────────────────────────────────────────
Outputs:
  ApiEndpoint:
    Description: API Gateway base URL — set as VITE_API_BASE_URL in frontend .env.local
    Value: !Sub "https://${DrainGuardApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: DrainGuardApiEndpoint

  UploadsBucketName:
    Description: Private S3 bucket name for drain photographs
    Value: !Ref UploadsBucket
    Export:
      Name: DrainGuardUploadsBucket

  ReportsTableName:
    Description: DynamoDB table name
    Value: !Ref ReportsTable
    Export:
      Name: DrainGuardReportsTable
